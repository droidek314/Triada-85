# TRIADA-NET on one small server (M18): the TRIADA-NET server, and Caddy in
# front of it for HTTPS. Caddy gets a free TLS certificate for your domain by
# itself, so the web version (served over HTTPS by GitHub Pages) can reach the
# server as wss://YOUR-DOMAIN/net.
#
#   cd deploy
#   cp .env.example .env      # then edit .env
#   docker compose up -d --build
#
# Step by step, for a first-time deployer: docs/net/DEPLOY.md.

services:
  triada-net:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TRIADA_NET_DB: /data/triada-net.db
      # WebSocket callers arrive through Caddy: their address is in X-Forwarded-For.
      TRIADA_NET_TRUST_PROXY: "true"
    volumes:
      - triada-data:/data
    ports:
      # TCP for desktop emulators (triada run --modem YOUR-DOMAIN:2385), straight to the server.
      - "2385:2385"
    expose:
      # The WebSocket port is NOT published: it is reached only through Caddy.
      - "2386"

  caddy:
    # Pin an exact version here once you have tested one (e.g. caddy:2.10.2).
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - triada-net
    ports:
      - "80:80"
      - "443:443"
    environment:
      TRIADA_NET_DOMAIN: ${TRIADA_NET_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  triada-data:
  caddy-data:
  caddy-config:
